<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#08080c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Board frame -->
  <rect x="96" y="80" width="320" height="352" rx="24" fill="#151519" stroke="#2a2a35" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="96" y="80" width="320" height="48" rx="24" fill="#1a1a20"/>
  <rect x="96" y="104" width="320" height="24" fill="#1a1a20"/>
  
  <!-- Accent dots in header -->
  <circle cx="136" cy="104" r="8" fill="#ef4444"/>
  <circle cx="164" cy="104" r="8" fill="#f59e0b"/>
  <circle cx="192" cy="104" r="8" fill="#22c55e"/>
  
  <!-- Content tiles -->
  <!-- Tile 1 - text note -->
  <rect x="120" y="152" width="128" height="88" rx="12" fill="#1f1f28"/>
  <rect x="136" y="168" width="80" height="8" rx="4" fill="#4a4a58"/>
  <rect x="136" y="184" width="96" height="6" rx="3" fill="#3a3a45"/>
  <rect x="136" y="196" width="72" height="6" rx="3" fill="#3a3a45"/>
  <rect x="136" y="208" width="88" height="6" rx="3" fill="#3a3a45"/>
  
  <!-- Tile 2 - URL card -->
  <rect x="264" y="152" width="128" height="88" rx="12" fill="#1f1f28"/>
  <rect x="280" y="168" width="96" height="48" rx="8" fill="url(#accent)" opacity="0.3"/>
  <circle cx="328" cy="192" r="12" fill="url(#accent)"/>
  <rect x="280" y="224" width="72" height="6" rx="3" fill="#4a4a58"/>
  
  <!-- Tile 3 - image -->
  <rect x="120" y="256" width="128" height="104" rx="12" fill="#1f1f28"/>
  <rect x="132" y="268" width="104" height="68" rx="8" fill="url(#accent)" opacity="0.2"/>
  <circle cx="160" cy="296" r="12" fill="url(#accent)" opacity="0.5"/>
  <polygon points="140,328 184,296 220,328" fill="url(#accent)" opacity="0.4"/>
  <rect x="136" y="344" width="64" height="6" rx="3" fill="#4a4a58"/>
  
  <!-- Tile 4 - file/doc -->
  <rect x="264" y="256" width="128" height="104" rx="12" fill="#1f1f28"/>
  <rect x="292" y="272" width="72" height="56" rx="8" fill="#2a2a35"/>
  <path d="M340 272 L364 296 L364 328 L292 328 L292 272 Z" fill="#2a2a35"/>
  <path d="M340 272 L340 296 L364 296" fill="none" stroke="#4a4a58" stroke-width="2"/>
  <rect x="304" y="308" width="48" height="4" rx="2" fill="#4a4a58"/>
  <rect x="280" y="344" width="80" height="6" rx="3" fill="#4a4a58"/>
  
  <!-- Plus button -->
  <circle cx="384" cy="400" r="32" fill="url(#accent)"/>
  <rect x="372" y="392" width="24" height="4" rx="2" fill="white"/>
  <rect x="380" y="384" width="4" height="24" rx="2" fill="white"/>
</svg>
