<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Info Board</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <!-- Settings Screen -->
    <div id="settings-screen" class="screen">
      <div class="settings-container">
        <div class="settings-header">
          <div class="logo">
            <span class="logo-icon">📋</span>
            <h1>Info Board</h1>
          </div>
          <p class="subtitle">Connect to your server</p>
        </div>
        
        <form id="settings-form" class="settings-form">
          <div class="form-group">
            <label for="server-url">Server URL</label>
            <input 
              type="url" 
              id="server-url" 
              placeholder="https://your-server.com"
              autocomplete="url"
              required
            >
            <span class="hint">Your Info Board server address</span>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              placeholder="Server password"
              autocomplete="current-password"
            >
            <span class="hint">Leave empty if no password required</span>
          </div>
          
          <button type="submit" class="btn btn-primary" id="connect-btn">
            <span class="btn-text">Connect</span>
            <span class="btn-loading" hidden>Connecting...</span>
          </button>
          
          <div id="connection-error" class="error-message" hidden></div>
        </form>
      </div>
    </div>
    
    <!-- Main Screen -->
    <div id="main-screen" class="screen" hidden>
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <span class="logo-icon-small">📋</span>
          <span class="server-name" id="server-name">Info Board</span>
        </div>
        <button class="icon-btn" id="settings-btn" aria-label="Settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>
      
      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat">
          <span class="stat-value" id="total-posts">0</span>
          <span class="stat-label">posts</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="streak-count">0</span>
          <span class="stat-label">day streak</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="today-count">0</span>
          <span class="stat-label">today</span>
        </div>
      </div>
      
      <!-- Capture Area -->
      <div class="capture-area">
        <div class="capture-card">
          <div class="capture-tabs">
            <button class="tab active" data-tab="text">
              <span class="tab-icon">📝</span>
              <span class="tab-label">Note</span>
            </button>
            <button class="tab" data-tab="url">
              <span class="tab-icon">🔗</span>
              <span class="tab-label">URL</span>
            </button>
            <button class="tab" data-tab="file">
              <span class="tab-icon">📎</span>
              <span class="tab-label">File</span>
            </button>
          </div>
          
          <!-- Text Input -->
          <div class="capture-content" data-content="text">
            <textarea 
              id="text-input" 
              placeholder="What's on your mind?"
              rows="4"
            ></textarea>
          </div>
          
          <!-- URL Input -->
          <div class="capture-content" data-content="url" hidden>
            <input 
              type="url" 
              id="url-input" 
              placeholder="https://example.com"
            >
            <p class="input-hint">Paste a URL to save with metadata</p>
          </div>
          
          <!-- File Input -->
          <div class="capture-content" data-content="file" hidden>
            <div class="file-drop" id="file-drop">
              <span class="file-icon">📁</span>
              <p>Tap to select or drop a file</p>
              <input type="file" id="file-input" accept="image/*,audio/*,video/*,.pdf,.doc,.docx,.txt">
            </div>
            <div id="file-preview" class="file-preview" hidden>
              <span class="file-name" id="file-name"></span>
              <button class="clear-file" id="clear-file">×</button>
            </div>
          </div>
          
          <button class="btn btn-primary btn-capture" id="capture-btn">
            <span class="btn-icon">⚡</span>
            <span>Capture</span>
          </button>
        </div>
      </div>
      
      <!-- Recent Captures -->
      <div class="recent-section">
        <h2 class="section-title">Recent Captures</h2>
        <div id="recent-list" class="recent-list">
          <div class="empty-state">
            <span class="empty-icon">✨</span>
            <p>No captures yet. Start by adding something above!</p>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Toast -->
    <div id="toast" class="toast" hidden>
      <span class="toast-icon">✓</span>
      <span class="toast-message"></span>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay" hidden>
      <div class="spinner"></div>
    </div>
  </div>
  
  <script src="app.js" type="module"></script>
</body>
</html>
